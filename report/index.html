<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1B3A5C">
<meta name="color-scheme" content="light">
<title>모임 보고 — 청년샘터</title>
<meta property="og:title" content="청년샘터 모임 보고">
<meta property="og:description" content="모임을 마친 자리에서 참석자와 사진을 남겨 주세요">
<meta property="og:type" content="website">
<meta property="og:url" content="https://yos-saemteo.github.io/saemteo/report/">
<meta property="og:image" content="https://yos-saemteo.github.io/saemteo/og-cover.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --navy: #1B3A5C; --ink: #18283A; --sub: #56636F; --sub2: #3E4D5B; --ground: #EEF3F7;
    --line: #C5D1DC; --line2: #D5DEE6; --link: #1F6FB5;
    --amber-bg: #FBEFD9; --amber: #7D5208; --red-bg: #FBE9E9; --red: #A0302B; --blue-bg: #E9F2FA;
    --sans: 'IBM Plex Sans KR', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    --serif: 'Noto Serif KR', 'Noto Serif CJK KR', serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--ground); }
  body { color: var(--ink); font-family: var(--sans); word-break: keep-all; -webkit-text-size-adjust: 100%; }
  a { color: var(--link); }
  button, input { font-family: inherit; }
  button { -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .page { max-width: 480px; min-height: 100vh; min-height: 100dvh; margin: 0 auto; display: flex; flex-direction: column;
          padding: max(12px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom)); }
  .grow { flex-grow: 1; }

  .top { display: flex; align-items: center; gap: 8px; min-height: 52px; padding-left: 4px; }
  .brand { display: flex; align-items: center; gap: 8px; font-family: var(--serif); font-weight: 700; font-size: 17px; color: var(--navy); }
  .who { min-width: 0; overflow: hidden; text-overflow: ellipsis; font-size: 14px; font-weight: 600; white-space: nowrap; }
  @media (max-width: 359px) { .brand .txt { display: none; } .top { gap: 4px; } .pill { padding: 0 10px; } }
  .textbtn { display: inline-flex; align-items: center; min-height: 44px; padding: 0 8px; border: 0; background: none; color: var(--link); font-size: 14px; cursor: pointer; }
  .pill { display: inline-flex; align-items: center; gap: 5px; min-height: 44px; padding: 0 12px; border-radius: 22px; background: #fff;
          box-shadow: inset 0 0 0 1px var(--line2); color: var(--navy); font-size: 14px; font-weight: 600; text-decoration: none; white-space: nowrap; }
  .trial { padding: 2px 8px; border-radius: 999px; background: var(--amber-bg); color: var(--amber); font-family: var(--sans); font-size: 11px; font-weight: 700; }

  .hero { margin-top: 44px; display: flex; flex-direction: column; gap: 12px; padding: 0 8px; }
  .hero .logo { display: flex; align-items: center; gap: 10px; }
  .hero .logo b { display: block; font-family: var(--serif); font-size: 19px; line-height: 1; color: var(--navy); }
  .hero .logo small { display: block; margin-top: 4px; font-size: 10px; letter-spacing: .32em; color: var(--sub); }
  h1 { margin: 0; font-family: var(--serif); font-weight: 700; color: var(--navy); line-height: 1.3; font-size: 26px; }
  h1:focus { outline: none; }
  .hero h1 { margin-top: 36px; font-size: 32px; line-height: 1.25; }
  .lead { margin: 0; font-size: 16px; line-height: 1.65; color: var(--sub); }

  .form { margin-top: 32px; display: flex; flex-direction: column; gap: 18px; padding: 0 8px; }
  .field { display: flex; flex-direction: column; gap: 8px; }
  .field label { font-size: 14px; font-weight: 600; }
  .field input { height: 54px; padding: 0 16px; border: 1px solid var(--line); border-radius: 12px; background: #fff; font-size: 17px; color: var(--ink); }
  .field input::placeholder, .addrow input::placeholder, .amt input::placeholder { color: #66727E; }
  .field input.digits { letter-spacing: .3em; }
  .check { display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 15px; }
  .check input { width: 20px; height: 20px; margin: 0; accent-color: var(--navy); }

  .msg { margin: 0; padding: 12px 14px; border-radius: 12px; font-size: 14px; line-height: 1.6; }
  .msg.info { background: var(--amber-bg); color: var(--amber); }
  .msg.err { background: var(--red-bg); color: var(--red); }

  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 56px; border: 0; border-radius: 14px;
         background: var(--navy); color: #fff; font-size: 17px; font-weight: 600; text-decoration: none; cursor: pointer; }
  .btn[disabled] { background: #A9B7C4; cursor: default; }
  .btn.busy[disabled] { background: var(--navy); opacity: .85; }
  .btn.block[disabled] { background: #C9D3DC; color: var(--sub2); font-size: 16px; }
  .btn.ghost { height: 50px; background: #fff; box-shadow: inset 0 0 0 1.5px var(--line); color: var(--navy); font-size: 16px; }
  .stack { display: flex; flex-direction: column; gap: 12px; margin-top: 24px; }
  .foot { margin: 2px 0 0; text-align: center; font-size: 13px; line-height: 1.6; color: var(--sub); }
  .spin { width: 18px; height: 18px; border: 2.5px solid rgba(255,255,255,.45); border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite; }
  .spin.dark { border-color: rgba(27,58,92,.2); border-top-color: var(--navy); width: 28px; height: 28px; }
  .spin.sm { width: 14px; height: 14px; border-width: 2px; border-color: rgba(27,58,92,.2); border-top-color: var(--navy); flex-shrink: 0; margin-top: 2px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation-duration: 2.4s; } }

  .head { padding: 26px 4px 0; display: flex; flex-direction: column; gap: 8px; }
  .head p { margin: 0; font-size: 15px; line-height: 1.6; color: var(--sub); }
  .cards { margin: 22px 0 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 12px; }
  .card { display: flex; align-items: flex-start; gap: 12px; padding: 16px; border-radius: 16px; background: #fff; box-shadow: inset 0 0 0 1px var(--line2); cursor: pointer; }
  .card.on { box-shadow: inset 0 0 0 2px var(--navy); }
  .card.off { cursor: default; opacity: .7; }
  .card input { width: 20px; height: 20px; margin: 2px 0 0; flex-shrink: 0; accent-color: var(--navy); }
  .card .body { flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
  .card .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .card .title { font-size: 17px; font-weight: 700; margin-right: auto; }
  .tag { flex-shrink: 0; padding: 2px 8px; border: 1px solid var(--line); border-radius: 999px; color: var(--sub2); font-size: 12px; font-weight: 600; }
  .tag.today { border: 0; background: var(--navy); color: #fff; padding: 3px 9px; }
  .card .when { font-size: 14px; color: var(--sub2); }
  .card .mem { font-size: 14px; line-height: 1.5; color: var(--sub); }
  .card .state { font-size: 13px; font-weight: 600; }

  .tabs { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; border-radius: 14px; background: #DDE6EE; }
  .tabs button { flex: 1 1 40%; display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 46px; padding: 0 8px; border: 0; border-radius: 11px;
                 background: transparent; color: var(--sub2); font-size: 15px; font-weight: 700; cursor: pointer; }
  .tabs.many button { flex-basis: 100%; }
  .tabs button[aria-pressed="true"] { background: #fff; color: var(--navy); box-shadow: 0 1px 2px rgba(27,58,92,.12); }
  .tabs .mini { padding: 1px 6px; border-radius: 6px; background: var(--ground); color: var(--sub2); font-size: 11px; font-weight: 600; }
  .eyebrow { margin: 0; font-size: 14px; color: var(--sub); }
  .due { margin: 2px 0 0; display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--sub); }
  .panel { margin-top: 20px; padding: 20px; display: flex; flex-direction: column; gap: 14px; background: #fff; border-radius: 18px; box-shadow: 0 1px 2px rgba(27,58,92,.08); }
  .panel h2 { margin: 0; font-size: 15px; font-weight: 700; }
  .panel .big { font-size: 20px; font-weight: 700; }
  .panel p { margin: 0; font-size: 14px; line-height: 1.6; color: var(--sub); }
  .kv { margin: 0; display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 10px 12px; font-size: 15px; line-height: 1.5; }
  .kv dt { color: var(--sub); }
  .kv dd { margin: 0; font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { padding: 8px 14px; border-radius: 999px; background: var(--ground); box-shadow: inset 0 0 0 1px var(--line2); font-size: 15px; font-weight: 600; color: var(--ink); }
  .center { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; color: var(--sub); font-size: 15px; }
  .setup { margin: 12px 4px 0; padding: 10px 12px; border-radius: 10px; background: var(--red-bg); color: var(--red); font-size: 13px; line-height: 1.5; }

  /* ---------- 모임 보고 ---------- */
  .back { display: inline-flex; align-items: center; gap: 2px; min-height: 44px; margin-left: -6px; padding: 0 10px 0 2px; border: 0; background: none;
          color: var(--navy); font-size: 15px; font-weight: 600; cursor: pointer; }
  .place { margin: 0; display: flex; align-items: center; flex-wrap: wrap; gap: 5px 6px; font-size: 14px; font-weight: 600; color: var(--navy); }
  .sec { margin-top: 16px; padding: 20px; display: flex; flex-direction: column; gap: 12px; background: #fff; border-radius: 18px; box-shadow: 0 1px 2px rgba(27,58,92,.08); }
  .sec:first-of-type { margin-top: 20px; }
  .sec h2, .sec .h2 { margin: 0; font-size: 16px; font-weight: 700; }
  .sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .sec-head.start { justify-content: flex-start; align-items: center; }
  .count { font-size: 15px; font-weight: 700; color: var(--navy); }
  .hint { font-size: 13px; color: var(--sub); }
  .need { padding: 3px 7px; border-radius: 6px; background: var(--amber-bg); color: var(--amber); font-size: 12px; font-weight: 700; }
  .note { margin: 0; font-size: 14px; line-height: 1.6; color: var(--sub); }
  .note.ink { color: var(--sub2); }
  .note.sm { font-size: 13px; line-height: 1.55; }
  .inp { width: 100%; height: 52px; padding: 0 14px; border: 1px solid var(--line); border-radius: 12px; background: #fff; font-size: 17px; color: var(--ink); }
  .inp:disabled { background: #F3F6F9; }
  .box { margin: 0; display: flex; align-items: flex-start; gap: 8px; padding: 10px 12px; border-radius: 10px; font-size: 14px; line-height: 1.55; }
  .box svg { flex-shrink: 0; margin-top: 1px; }
  .box.blue { background: var(--blue-bg); color: var(--navy); }
  .box.amber { background: var(--amber-bg); color: var(--amber); }
  .box.red { background: var(--red-bg); color: var(--red); }
  .names { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
  .name { display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 4px 0 7px; border-radius: 22px; background: #E4EFF8; max-width: 100%; }
  .name .no { display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; flex-shrink: 0; border-radius: 12px; background: var(--navy); color: #fff; font-size: 12px; font-weight: 700; }
  .name .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 15px; font-weight: 600; }
  .x { display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; flex-shrink: 0; padding: 0; border: 0; border-radius: 18px; background: transparent; color: var(--sub2); cursor: pointer; }
  .empty { margin: 0; padding: 12px; border-radius: 10px; background: #F3F6F9; font-size: 14px; color: var(--sub); text-align: center; }
  .addrow { display: flex; gap: 8px; }
  .addrow input { flex-grow: 1; min-width: 0; height: 48px; padding: 0 14px; border: 1px solid var(--line); border-radius: 12px; background: #fff; font-size: 16px; color: var(--ink); }
  .addrow button { flex-shrink: 0; height: 48px; padding: 0 18px; border: 0; border-radius: 12px; background: var(--navy); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
  .sugg-wrap { display: flex; flex-direction: column; gap: 8px; }
  .sugg-title { font-size: 13px; font-weight: 600; color: var(--sub); }
  .sugg { display: flex; align-items: center; gap: 4px; height: 44px; padding: 0 14px 0 10px; border: 1px solid var(--line); border-radius: 22px; background: #fff;
          color: var(--navy); font-size: 15px; font-weight: 600; cursor: pointer; }
  .shots { display: flex; flex-wrap: wrap; gap: 10px; }
  .thumb { position: relative; width: 104px; height: 104px; flex-shrink: 0; border-radius: 12px; overflow: hidden; background: #D6E3EE; }
  .thumb.sm { width: 60px; height: 92px; border-radius: 10px; }
  .thumb img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .thumb .ph { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #56708A; font-size: 12px; font-weight: 700; }
  .thumb .ov { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 0; border: 0;
               background: rgba(24,40,58,.42); color: #fff; font-size: 13px; font-weight: 700; }
  .thumb .ov.bad { background: rgba(160,48,43,.78); cursor: pointer; }
  .thumb .done { position: absolute; left: 5px; bottom: 5px; display: flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 11px;
                 background: #fff; color: var(--navy); box-shadow: 0 1px 2px rgba(0,0,0,.2); }
  .thumb .del { position: absolute; top: 4px; right: 4px; display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; padding: 0; border: 0;
                border-radius: 16px; background: rgba(24,40,58,.72); color: #fff; cursor: pointer; }
  .tile { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; width: 104px; height: 104px; flex-shrink: 0;
          border: 1.5px dashed #9FB1C2; border-radius: 12px; background: #F7FAFC; color: var(--navy); font-size: 14px; font-weight: 600; cursor: pointer; }
  #pick-shot:focus-visible ~ #shot-box .tile, #pick-rc:focus-visible + label { outline: 2px solid var(--link); outline-offset: 2px; }
  .rc-list { display: flex; flex-direction: column; gap: 12px; }
  .rc-list:empty { display: none; }
  .rc { display: flex; flex-direction: column; gap: 10px; padding: 10px 12px 12px; border: 1px solid #DCE4EB; border-radius: 14px; }
  .rc-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 15px; font-weight: 700; }
  .rc-head .x { width: 44px; height: 44px; margin: -6px -8px -6px 0; border-radius: 22px; }
  .rc-body { display: flex; align-items: flex-start; gap: 12px; }
  .rc-right { flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  .seg { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 3px; border-radius: 11px; background: var(--ground); }
  .seg button { height: 38px; padding: 0; border: 0; border-radius: 8px; background: transparent; color: var(--sub); font-size: 14px; font-weight: 600; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: #fff; color: var(--navy); box-shadow: 0 1px 2px rgba(27,58,92,.18); }
  @media (max-width: 359px) { .seg .w { display: none; } }
  .amt { display: flex; align-items: center; gap: 6px; font-size: 15px; }
  .amt input { width: 100%; min-width: 0; height: 46px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff;
               font-size: 17px; font-weight: 600; text-align: right; color: var(--ink); }
  .rc-msg { display: flex; flex-direction: column; gap: 8px; }
  .rc-msg:empty { display: none; }
  .st { margin: 0; display: flex; align-items: flex-start; gap: 6px; font-size: 13px; line-height: 1.5; color: var(--sub); }
  .st svg { flex-shrink: 0; margin-top: 1px; }
  .st.okc { color: var(--navy); }
  .st.warn { padding: 8px 10px; border-radius: 8px; background: var(--amber-bg); color: var(--amber); }
  .st.bad { color: var(--red); }
  .nw { white-space: nowrap; }
  .linkbtn { display: inline; padding: 0; border: 0; background: none; color: var(--link); font-size: inherit; font-weight: 600; text-decoration: underline; cursor: pointer; }
  .cands { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .cands-t { width: 100%; font-size: 13px; color: var(--sub); }
  .cand { height: 36px; padding: 0 12px; border: 1px solid var(--line); border-radius: 18px; background: #fff; color: var(--navy); font-size: 14px; font-weight: 600; cursor: pointer; }
  .more { display: flex; align-items: center; justify-content: center; gap: 6px; height: 48px; border: 1.5px dashed #9FB1C2; border-radius: 12px; background: #F7FAFC;
          color: var(--navy); font-size: 15px; font-weight: 600; cursor: pointer; }
  .sum { display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; border-radius: 12px; background: #F3F7FA; }
  .sum .r { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; color: var(--sub2); }
  .sum .hr { height: 1px; background: #DCE4EB; }
  .sum .tot { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 15px; font-weight: 700; }
  .sum .tot b { font-size: 18px; color: var(--navy); }
  #rc-sum { display: flex; flex-direction: column; gap: 10px; }
  #rc-sum:empty { display: none; }
  .toast { position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom)); transform: translate(-50%, 20px); max-width: calc(100% - 32px); padding: 12px 16px;
           border-radius: 12px; background: rgba(24,40,58,.92); color: #fff; font-size: 14px; line-height: 1.5; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<div id="app" class="page"></div>
<noscript><p style="padding:24px">이 페이지는 자바스크립트가 켜져 있어야 열려요.</p></noscript>

<script>
// ============================================================
//  청년샘터 모임 보고 — 샘지기 화면 (시범: 본인 확인 · 샘터 고르기 · 모임 보고 작성 — 사진 올리기 · 금액 읽기)
//  ★ 아래 API에 Apps Script 웹앱 배포 주소(…/exec)를 넣습니다.
// ============================================================
const API = "https://script.google.com/macros/s/AKfycbwZFOS7D9T4-haOAyQxBPy0SP0NJ4m4uO3KgTt6d81g8RA2BpXGCID2YpVaJlPI9zQj/exec";   // ★ Apps Script 배포 주소 (/exec로 끝남). 바꿀 때는 따옴표 안만 바꿈
const API주소 = /^https?:\/\/\S+\/exec(\?\S*)?$/.test(API.trim()) ? API.trim() : "";   // /exec 주소가 아니면 비어 있는 것으로 봄
const API가dev = /\/dev(\?\S*)?$/.test(API.trim());
const 문의기본 = "https://open.kakao.com/o/sWdAUBFi";
const 영수증제출안내 = "https://yos-saemteo.github.io/saemteo/receipt/";
const 저장키 = "saemteo.report.v1";
const 사진최대 = 20 * 1048576;      // 원본 한 장 한도 — 서버 MB.사진최대MB와 같게
const 사본최대 = 1.8 * 1048576;     // 금액 읽기용 사본 한도 — 서버 MB.판독최대KB(1900KB)보다 조금 작게
const 최대장수 = { 인증샷: 4, 영수증: 20 };

const S = {
  화면: "확인",        // 확인 · 여는중 · 고르기 · 샘터 · 보고
  이름: "", 번호: "", 전체: "", 전체필요: false, 기억: true,
  보내는중: false, 메시지: "", 메시지종류: "",
  결과: null, 고른: "", 문의: 문의기본,
  로그인: null,        // 확인된 { 이름, 번호 } — 토큰이 풀리면 이것으로 조용히 다시 확인
  토큰: "",            // 본인 확인 때 서버가 준 토큰 (6시간) — 사진 · 금액 요청에 붙임

async function 보내기(내용, 초) {
  if (!API주소) throw new Error("설정");
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), (초 || 25) * 1000);
  try {
    // 머리글을 따로 붙이지 않음 → text/plain으로 가서 사전 요청(CORS) 없이 바로 전달
    const r = await fetch(API주소, { method: "POST", body: JSON.stringify(내용), signal: ctl.signal, redirect: "follow" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    return await r.json();
  } finally { clearTimeout(t); }
}
async function 설정받기() {
  if (!API주소) return;
  try {
    const r = await fetch(API주소, { redirect: "follow" });
    const d = await r.json();
    if (d && d.ok && d.문의) { S.문의 = d.문의; 링크고치기(); }
  } catch (e) {}
}

function 숫자만(v) { return String(v || "").replace(/\D/g, ""); }
function 날짜(ymd) { const p = String(ymd || "").split("-").map(Number); return p.length === 3 && p[0] ? new Date(p[0], p[1] - 1, p[2]) : null; }
function ymd(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function 날글(v) { const d = 날짜(v); return d ? `${d.getMonth() + 1}월 ${d.getDate()}일(${요일[d.getDay()]})` : ""; }
function 날짧게(v) { const d = 날짜(v); return d ? `${d.getMonth() + 1}월 ${d.getDate()}일` : ""; }
function 월글(ym) { const p = String(ym || "").split("-"); return p.length === 2 ? `${Number(p[0])}년 ${Number(p[1])}월` : ""; }
function 요일글(t) { return /^[월화수목금토일]$/.test(t) ? t + "요일" : t; }
function 원(v) { return String(v).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
function 이름키(v) { let s = String(v || ""); try { s = s.normalize("NFC"); } catch (e) {} return s.replace(/\s+/g, "").toLowerCase(); }
function 오늘요일() { const d = 날짜(S.결과 && S.결과.오늘); return d ? d.getDay() : new Date().getDay(); }

//   사진은 고르는 즉시 원본 그대로 올리고(한 번에 두 장씩), 영수증은 폰에서 작은 사본을 만들어 금액부터 읽음
//   화면 전체를 다시 그리지 않고 바뀐 칸만 고침 — 이름 · 금액을 적는 중에 글자판이 닫히지 않게
//   파일 고르기 칸(input type=file)은 다시 그리는 칸 밖에 둠 — 사진 창이 열려 있는 동안 칸이 바뀌어도 고른 사진이 사라지지 않게
// ============================================================
function 날짜범위(t) {
  const [y, m] = String(t.운영월).split("-").map(Number);
  const 끝 = `${t.운영월}-${String(new Date(y, m, 0).getDate()).padStart(2, "0")}`;
  const 오늘 = 오늘값();
  return { min: `${t.운영월}-01`, max: 오늘 < 끝 ? 오늘 : 끝 };
}
function 오늘값() { const 기기 = ymd(new Date()), 서버 = (S.결과 && S.결과.오늘) || ""; return 서버 > 기기 ? 서버 : 기기; }
function 날짜맞음(t, v) { const r = 날짜범위(t); return /^\d{4}-\d{2}-\d{2}$/.test(v || "") && v >= r.min && v <= r.max; }
// 처음 날짜: 이번 달이면 오늘까지 중 가장 가까운 모임 요일, 지난달이면 그 달 마지막 모임 요일 (요일을 모르면 오늘 · 말일)
function 기본날짜(t) {
  const r = 날짜범위(t);
  if (r.max < r.min) return "";
  const 요일들 = t.요일들 || [], d = 날짜(r.max);
  for (let i = 0; i < 7 && 요일들.length; i++) {
    const v = ymd(d);
    if (v < r.min) break;
    if (요일들.indexOf(d.getDay()) >= 0) return v;
    d.setDate(d.getDate() - 1);
  }
  return r.max;
}
// 주차 — v13과 같은 규칙: 1일이 든 주(월~일)가 1주차, 1일이 토 · 일이면 다음 주까지 1주차
function 주차정보(v) {
  const d = 날짜(v); if (!d) return null;
  const y = d.getFullYear(), m = d.getMonth() + 1, first = new Date(y, m - 1, 1), last = new Date(y, m, 0);
  const mon1 = new Date(first); mon1.setDate(1 - ((first.getDay() + 6) % 7));
  if (first.getDay() === 0 || first.getDay() === 6) mon1.setDate(mon1.getDate() + 7);
  let w = Math.floor(Math.round((d - mon1) / 86400000) / 7) + 1; if (w < 1) w = 1;
  let s = new Date(mon1); s.setDate(mon1.getDate() + 7 * (w - 1));
  let e = new Date(s); e.setDate(s.getDate() + 6);
  if (w === 1 || s < first) s = new Date(first);
  if (e > last) e = new Date(last);
  return { 주: w, 글: `${m}월 ${w}주차(${m}.${s.getDate()}~${m}.${e.getDate()})` };
}
function 초안(t) { return S.초안[t.id] || (S.초안[t.id] = { 날짜: 기본날짜(t), 참석: [], 사진: [] }); }
function 사진찾기(키) { for (const id in S.초안) { const p = S.초안[id].사진.find(x => x.키 === 키); if (p) return p; } return null; }
function 보고중(샘터id) { const t = 지금샘터(); return S.화면 === "보고" && t && t.id === 샘터id; }
function 칸(id, html) { const el = document.getElementById(id); if (el) el.innerHTML = html; }

function 보고화면() {
  const t = 지금샘터(), 초 = 초안(t), 범위 = 날짜범위(t);
  return `
  <div class="top"><button type="button" class="back" data-act="뒤로">${꺾쇠}${t.지난달 ? `${달숫자(t)}월 현황` : "이번 달 현황"}</button><span class="grow"></span>${문의알약()}</div>
  <div id="srv-note">${서버알림()}</div>
  <div class="head" style="padding-top:6px;gap:6px">
    <p class="place">${핀}${esc(t.이름표)} 샘터${t.팀구분 ? ` <span class="tag">${esc(t.팀구분)}</span>` : ""}${t.지난달 ? ` <span class="tag">${달숫자(t)}월</span>` : ""}</p>
    <h1>모임 보고</h1>
    <p>${esc(S.결과.이름)} 샘지기 · 모임이 끝난 자리에서 한 번에 내면 돼요</p>
  </div>

  <section class="sec" aria-labelledby="l-day">
    <label id="l-day" for="day" class="h2">모임 날짜</label>
    <input id="day" class="inp" type="date" value="${esc(초.날짜)}" min="${범위.min}" max="${범위.max}" ${범위.max < 범위.min ? "disabled" : ""}>
    <div id="day-info">${날짜알림(t, 초)}</div>
  </section>

  <section class="sec" aria-labelledby="h-who">
    <div class="sec-head"><h2 id="h-who">참석자</h2><span class="count" id="who-count">${초.참석.length}명</span></div>
    <p class="note">사진 왼쪽 사람부터 차례로 적어 주세요. 초대한 분도 이름만 적으면 돼요.</p>
    <div id="who-list">${참석목록(초)}</div>
    <form class="addrow" id="add-form" novalidate><label for="add" class="sr">참석자 이름</label>
      <input id="add" type="text" autocomplete="off" enterkeyhint="done" maxlength="60" placeholder="이름 입력">
      <button type="submit">추가</button></form>
    <div id="who-sugg">${제안목록(t, 초)}</div>
  </section>

  <section class="sec" aria-labelledby="h-shot">
    <div class="sec-head start"><h2 id="h-shot">인증샷</h2><span class="need">필수</span></div>
    <input type="file" id="pick-shot" class="sr" data-pick="인증샷" accept="image/*" multiple>
    <div id="shot-box">${인증샷목록(초)}</div>
    <p class="note">얼굴이 보이게, ‘날마다 솟는 샘물’ 책이나 앱 화면이 함께 나오게 찍어 주세요.</p>
  </section>

  <section class="sec" aria-labelledby="h-rc">
    <div class="sec-head"><h2 id="h-rc">영수증</h2><span class="hint">나중에 추가해도 돼요</span></div>
    <p class="note">영수증 한 장에 사진 한 장씩 올려 주세요. 금액은 사진에서 읽어 채워 둘게요.</p>
    <div id="rc-list" class="rc-list">${영수증목록(초)}</div>
    <input type="file" id="pick-rc" class="sr" data-pick="영수증" accept="image/*,application/pdf" multiple>
    <label for="pick-rc" class="more">${더하기}<span id="rc-more">${영수증더글(초)}</span></label>
    <div id="rc-sum">${합계칸(초)}</div>
  </section>

  <div class="stack" id="s-foot">${제출칸(t, 초)}</div>`;
}

function 서버알림() {
  return S.서버옛날 ? `<p class="setup">관리자 안내: 웹앱 서버가 아직 사진 올리기를 몰라요. Apps Script에서 2단계 코드를 붙이고 [배포 관리] → 새 버전으로 배포했는지 확인해 주세요.</p>` : "";
}

function 날짜알림(t, 초) {
  const r = 날짜범위(t);
  if (r.max < r.min) return `<p class="box amber">${느낌표()}<span>${달숫자(t)}월이 아직 시작되지 않아 날짜를 고를 수 없어요.</span></p>`;
  if (!날짜맞음(t, 초.날짜)) {
    const 글 = !초.날짜 ? "모임 날짜를 골라 주세요."
      : 초.날짜 > r.max && 초.날짜.slice(0, 7) === t.운영월 ? "아직 오지 않은 날짜예요. 모임한 날짜를 골라 주세요."
      : `${달숫자(t)}월 샘터라 ${달숫자(t)}월 날짜만 고를 수 있어요.`;
    return `<p class="box red">${느낌표()}<span>${esc(글)}</span></p>`;
  }
  const 주 = 주차정보(초.날짜);
  return `<p class="box blue">${폴더그림}<span><strong>${esc(주.글)}</strong> 폴더에 저장돼요</span></p>`;
}

function 참석목록(초) {
  if (!초.참석.length) return `<p class="empty">아직 적은 사람이 없어요</p>`;
  return `<ol class="names" aria-label="참석자 ${초.참석.length}명">${초.참석.map((n, i) => `
    <li class="name"><span class="no">${i + 1}</span><span class="nm">${esc(n)}</span><button type="button" class="x" data-act="참석빼기" data-i="${i}" aria-label="${esc(n)} 빼기">${엑스(16)}</button></li>`).join("")}</ol>`;
}
function 제안목록(t, 초) {
  const 남은 = (t.제안 || []).filter(n => !초.참석.some(x => 이름키(x) === 이름키(n)));
  if (!남은.length) return "";
  return `<div class="sugg-wrap"><span class="sugg-title">신청 명단에서 고르기</span><div class="chips">${남은.map(n => `
    <button type="button" class="sugg" data-act="제안추가" data-name="${esc(n)}" aria-label="${esc(n)} 추가">${더하기}${esc(n)}</button>`).join("")}</div></div>`;
}

function 인증샷목록(초) {
  const 사진 = 초.사진.filter(p => p.종류 === "인증샷");
  const 실패 = 사진.filter(p => p.올림 === "실패");
  return `
    <div class="shots">${사진.map((p, i) => `
      <div class="thumb" id="th-${p.키}">${썸네일속(p, "인증샷 " + (i + 1))}
        <button type="button" class="del" data-act="사진빼기" data-key="${p.키}" aria-label="인증샷 ${i + 1} 빼기">${엑스(14)}</button></div>`).join("")}
      ${사진.length < 최대장수.인증샷 ? `<label for="pick-shot" class="tile">${카메라}${사진.length ? "한 장 더" : "사진 추가"}</label>` : ""}
    </div>
    ${실패.map(p => `<p class="st bad">${느낌표(16)}<span>인증샷 ${사진.indexOf(p) + 1}: ${esc(p.올림오류)}${p.막힘 ? " 빼고 다시 골라 주세요." : ` <button type="button" class="linkbtn" data-act="다시올리기" data-key="${p.키}">다시 올리기</button>`}</span></p>`).join("")}`;
}

function 썸네일속(p, 이름) {
  const 그림 = p.주소 && !p.미리보기실패 ? `<img src="${p.주소}" alt="${esc(이름)}" data-key="${p.키}">`
    : `<span class="ph" role="img" aria-label="${esc(이름)}">${p.pdf ? "PDF" : p.종류 === "영수증" ? 영수증그림 : "사진"}</span>`;
  let 상태 = "";
  if (p.올림 === "올리는중" || p.올림 === "대기") 상태 = `<span class="ov" title="올리는 중"><span class="spin"></span></span>`;
  else if (p.올림 === "실패") 상태 = p.막힘 ? `<span class="ov bad" aria-hidden="true">!</span>`
    : `<button type="button" class="ov bad" data-act="다시올리기" data-key="${p.키}" aria-label="${esc(이름)} 다시 올리기">!<span>다시</span></button>`;
  else if (p.올림 === "저장됨") 상태 = `<span class="done" title="올렸어요">${체크(12)}</span>`;
  return 그림 + 상태;
}

function 영수증목록(초) {
  return 초.사진.filter(p => p.종류 === "영수증").map((p, i) => 영수증카드(p, i + 1, 초)).join("");
}
function 영수증더글(초) { return 초.사진.some(p => p.종류 === "영수증") ? "영수증 한 장 더" : "영수증 사진 넣기"; }
function 영수증카드(p, 번호, 초) {
  return `
  <div class="rc" id="rc-${p.키}">
    <div class="rc-head"><span>영수증 ${번호}</span><button type="button" class="x" data-act="사진빼기" data-key="${p.키}" aria-label="영수증 ${번호} 빼기">${엑스(18)}</button></div>
    <div class="rc-body">
      <div class="thumb sm" id="th-${p.키}">${썸네일속(p, "영수증 " + 번호)}</div>
      <div class="rc-right">
        <div class="seg" role="group" aria-label="영수증 ${번호} 종류">
          <button type="button" data-act="종류" data-key="${p.키}" data-kind="종이" aria-pressed="${p.구분 === "종이"}" aria-label="종이 영수증">종이<span class="w"> 영수증</span></button>
          <button type="button" data-act="종류" data-key="${p.키}" data-kind="전자" aria-pressed="${p.구분 === "전자"}" aria-label="전자영수증">전자<span class="w">영수증</span></button>
        </div>
        <div class="amt"><label for="amt-${p.키}" class="sr">영수증 ${번호} 금액</label>
          <input id="amt-${p.키}" data-amt="${p.키}" type="text" inputmode="numeric" autocomplete="off" placeholder="${읽는중(p) ? "읽는 중" : "0"}" value="${p.금액 ? 원(p.금액) : ""}"><span>원</span></div>
      </div>
    </div>
    <div class="rc-msg" id="rm-${p.키}" aria-live="polite">${영수증알림(p, 초)}</div>
  </div>`;
}

function 영수증알림(p, 초) {
  const 줄 = [];
  if (p.올림 === "실패") 줄.push(`<p class="st bad">${느낌표(16)}<span>${esc(p.올림오류)}${p.막힘 ? " 이 영수증을 빼고 다시 넣어 주세요." : ` <button type="button" class="linkbtn" data-act="다시올리기" data-key="${p.키}">다시 올리기</button>`}</span></p>`);
  const 같은날 = p.영수증날짜 && 초.날짜 && p.영수증날짜 === 초.날짜;
  if (읽는중(p)) 줄.push(`<p class="st"><span class="spin sm"></span><span>사진에서 금액 읽는 중… 그동안 다른 칸을 채워 주세요.</span></p>`);
  else if (p.판독 === "대기") 줄.push(`<p class="st">사진을 다 올리면 금액을 읽어요.</p>`);
  else if (p.판독 === "읽음") {
    const 읽은 = 원(p.읽은금액) + "원";
    if (p.금액 && Number(p.금액) === p.읽은금액) 줄.push(`<p class="st okc">${체크(16)}<span>사진에서 읽은 금액이에요${같은날 ? ` · 영수증 날짜 <span class="nw">${날짧게(p.영수증날짜)}</span>` : ""}</span></p>`);
    else if (p.금액 && p.출처 === "후보") 줄.push(`<p class="st">사진에서 찾은 다른 금액으로 바꿨어요 · 처음 읽은 금액 ${읽은}</p>`);
    else if (p.금액) 줄.push(`<p class="st">직접 고친 금액이에요 · 사진에서 읽은 금액 ${읽은}</p>`);
    else 줄.push(`<p class="st">사진에서 읽은 금액은 ${읽은}이에요.</p>`);
  } else if (p.판독 === "못읽음") 줄.push(`<p class="st">금액을 못 읽었어요. 직접 적어 주세요.</p>`);
  if (p.영수증날짜 && 초.날짜 && !같은날) 줄.push(`<p class="st warn">${느낌표(16)}<span>영수증 날짜가 <span class="nw">${날짧게(p.영수증날짜)}</span>이에요. 모임 날짜와 달라요.</span></p>`);
  const 다른 = p.판독 === "읽음" ? (p.후보 || []).filter(v => v !== Number(p.금액)).slice(0, 4) : [];
  if (다른.length) 줄.push(`<div class="cands"><span class="cands-t">${p.금액 ? "사진에서 찾은 다른 금액" : "눌러서 넣기"}</span>${다른.map(v => `<button type="button" class="cand" data-act="후보" data-key="${p.키}" data-v="${v}">${원(v)}원</button>`).join("")}</div>`);
  return 줄.join("");
}

function 합계칸(초) {
  const 영수증 = 초.사진.filter(p => p.종류 === "영수증");
  if (!영수증.length) return "";
  const 합 = 영수증.reduce((a, p) => a + (Number(p.금액) || 0), 0), 인원 = 초.참석.length;
  const 종이 = 영수증.filter(p => p.구분 === "종이").length, 전자 = 영수증.filter(p => p.구분 === "전자").length;
  return `
    <div class="sum">
      <div class="r"><span>영수증 합계</span><span>${원(합)}원</span></div>
      <div class="r"><span>참석</span><span>${인원}명</span></div>
      <div class="hr"></div>
      <div class="tot"><span>지원 예상</span><b>${합 > 0 && 인원 > 0 ? 원(Math.min(합, 5000 * 인원, 25000)) + "원" : "—"}</b></div>
      <p class="note sm">영수증 합계, 인당 5,000원, 모임당 25,000원 중 가장 적은 금액이에요. 월말에 확인한 뒤 확정돼요.</p>
    </div>
    ${종이 ? `<p class="note ink">종이 영수증 ${종이}장은 교역자실 앞 파일함에 넣어 주세요. <a href="${영수증제출안내}" target="_blank" rel="noopener">제출 위치 보기</a></p>` : ""}
    ${전자 ? `<p class="note ink">전자영수증은 올린 캡처가 증빙이에요. 편집하지 않은 원본 그대로 올려 주세요.</p>` : ""}`;
}

function 막힌까닭(t, 초) {
  const 사진 = 초.사진, 영수증 = 사진.filter(p => p.종류 === "영수증");
  if (!날짜맞음(t, 초.날짜)) return "모임 날짜를 골라 주세요";
