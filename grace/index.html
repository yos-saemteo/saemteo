<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<!-- ══════════════════════════════════════════════════════════
     은혜 나눔 설정 — 아래 따옴표 안에 웹앱 주소만 넣으면 됩니다.
     Apps Script → 배포 → 웹 앱 주소 (https://script.google.com/... /exec)
     비워두면 은혜 나눔 요소가 숨겨진 채로 페이지는 정상 동작합니다.
══════════════════════════════════════════════════════════ -->
<script>window.GRACE_API = 'https://script.google.com/macros/s/AKfycbwfNWhb0vSKiM4hj0OErNKjJam-PM3pXo4NEbD6Oq4AHhMjmTE2efklWUTBvfEJliab/exec';</script>

<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>은혜 나눔 | 청년샘터</title>
<meta property="og:title" content="은혜 나눔 | 청년샘터">
<meta property="og:description" content="샘터에서 받은 은혜를 함께 나눠요">
<!-- 카톡 미리보기: 지금은 메인 커버를 사용, 전용 이미지를 만들면 grace/og-grace.jpg로 교체 -->
<meta property="og:image" content="https://yos-saemteo.github.io/saemteo/og-cover.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 구글 서버와 미리 손을 잡아두면 첫 연결이 그만큼 빨라집니다 -->
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  :root {
    --water: #EBF4FA;     /* 메인 페이지 mist */
    --deep: #1B3A5C;      /* 메인 navy */
    --stream: #2E7CC4;    /* 메인 blue */
    --stone: #5A7186;     /* 메인 soft */
    --line: rgba(46,124,196,.18);
    --paper: #FFFFFF;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--water);
    color: var(--deep);
    font-family: "Noto Sans KR", -apple-system, "Apple SD Gothic Neo", sans-serif;
    line-height: 1.6;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 56px 22px 80px; }

  .home { display: inline-block; margin-bottom: 36px; color: var(--stone); text-decoration: none; font-size: .9rem; }
  .home:hover, .home:focus-visible { color: var(--stream); }
  header h1 {
    font-family: "Noto Serif KR", serif;
    font-size: clamp(2.4rem, 9vw, 3.4rem);
    font-weight: 700;
    line-height: 1.15;
    margin: 0 0 14px;
    letter-spacing: -0.02em;
  }
  header p { margin: 0 0 28px; color: var(--stone); font-size: 1rem; }

  .write {
    display: inline-block;
    background: var(--stream);
    color: #fff;
    text-decoration: none;
    font-weight: 600;
    padding: 13px 22px;
    border-radius: 999px;
  }
  .write:focus-visible { outline: 3px solid var(--deep); outline-offset: 3px; }
  .note { display: block; margin-top: 10px; font-size: .85rem; color: var(--stone); }

  .count { margin: 44px 0 0; font-size: .88rem; color: var(--stone); }

  #list { margin-top: 14px; border-top: 1px solid var(--line); }
  article { border-bottom: 1px solid var(--line); }

  /* 목록 한 줄 — 클릭하면 펼쳐진다 */
  summary {
    list-style: none; cursor: pointer;
    display: flex; align-items: flex-start; gap: 14px;
    padding: 22px 2px;
  }
  summary::-webkit-details-marker { display: none; }
  summary:focus-visible { outline: 2px solid var(--stream); outline-offset: 2px; }
  .head { flex: 1; min-width: 0; }
  .t {
    font-family: "Noto Serif KR", serif;
    font-size: 1.12rem; line-height: 1.5; font-weight: 700;
    word-break: keep-all; transition: color .2s;
  }
  summary:hover .t { color: var(--stream); }
  .meta { margin-top: 6px; font-size: .82rem; color: var(--stone); }
  .sign {
    flex: none; width: 22px; text-align: center;
    color: var(--stream); font-size: 1.3rem; font-weight: 300; line-height: 1.5;
    transition: transform .25s;
  }
  details[open] .sign { transform: rotate(45deg); }

  /* 제목만 있는 글 — 펼칠 내용이 없으니 클릭 대상이 아니다 */
  .flat { padding: 22px 2px; }
  .flat .t { font-weight: 600; }

  /* 펼쳐진 본문 */
  .answers { padding: 2px 2px 26px; }
  .qa + .qa { margin-top: 18px; }
  /* 작성자가 쓴 한 줄 나눔 — 질문 라벨 없이 맨 위에 */
  .lead { margin: 0 0 18px; }
  .lead .body { font-size: 1.1rem; }
  .q { margin: 0 0 4px; font-size: .82rem; font-weight: 700; color: var(--stream); }
  .body {
    font-family: "Noto Serif KR", serif;
    font-size: 1.05rem; line-height: 1.95;
    white-space: pre-wrap; word-break: keep-all; margin: 0;
  }

  .state { padding: 40px 0; color: var(--stone); text-align: center; }

  /* 불러오는 동안 보여줄 뼈대 — 빈 화면보다 덜 답답하게 */
  .skel { padding: 22px 2px; border-bottom: 1px solid var(--line); }
  .skel i {
    display: block; height: 15px; border-radius: 4px;
    background: linear-gradient(90deg, rgba(46,124,196,.10), rgba(46,124,196,.20), rgba(46,124,196,.10));
    background-size: 200% 100%;
    animation: shine 1.4s ease-in-out infinite;
  }
  .skel i + i { height: 11px; width: 42%; margin-top: 10px; }
  @keyframes shine { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  @media (prefers-reduced-motion: reduce) { .skel i { animation: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="home" href="../">청년샘터로 돌아가기</a>
    <h1>은혜 나눔</h1>
    <p>샘터에서 받은 은혜를 청년부 여러분과 함께 나눠요.</p>
    <a class="write" href="https://docs.google.com/forms/d/e/1FAIpQLSc1eo1RhGAOT8-e1M_r064WItjHNwf2iZlP3Rbs5Z72HyIiZw/viewform" target="_blank" rel="noopener">은혜 나누기</a>
    <span class="note">보내주신 글은 양육국 확인 후 올라갑니다.</span>
  </header>

  <p class="count" id="count"></p>

  <section id="list" aria-live="polite" aria-busy="true">
    <div class="skel"><i></i><i></i></div>
    <div class="skel"><i></i><i></i></div>
    <div class="skel"><i></i><i></i></div>
  </section>
</div>

<script>
  // 주소는 이 파일 맨 위 <head> 안에서 설정합니다 (window.GRACE_API).
  const API_URL = window.GRACE_API || '';
  const list = document.getElementById('list');

  const esc = s => String(s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  const 기본펼침 = 3;   // 최근 몇 개를 펼친 채로 보여줄지 (글이 적으면 전부 펼침)

  function render(posts) {
    if (!posts.length) {
      list.innerHTML = '<div class="state">아직 올라온 나눔이 없어요. 첫 번째 은혜를 나눠주세요.</div>';
      return;
    }

    const 펼칠개수 = posts.length <= 5 ? posts.length : 기본펼침;

    list.innerHTML = posts.map((p, i) => {
      const 머리 = `<div class="head">
            <div class="t">${esc(p.title)}</div>
            <div class="meta">${esc(p.author)} · ${esc(p.date)}</div>
          </div>`;
      // 작성자가 쓴 한 줄 나눔 — 질문 라벨 없이 본문 맨 위에 그대로
      const 첫머리 = p.lead
        ? `<div class="lead"><p class="body">${esc(p.lead)}</p></div>`
        : '';
      const 답변 = 첫머리 + (p.answers || []).map(x => `
            <div class="qa">
              <p class="q">${esc(x.q)}</p>
              <p class="body">${esc(x.a)}</p>
            </div>`).join('');

      // 펼칠 내용이 없으면 클릭 대상으로 만들지 않는다
      if (!답변) return `<article><div class="flat">${머리}</div></article>`;

      return `<article>
        <details${i < 펼칠개수 ? ' open' : ''}>
          <summary>${머리}<div class="sign" aria-hidden="true">+</div></summary>
          <div class="answers">${답변}</div>
        </details>
      </article>`;
    }).join('');

    list.setAttribute('aria-busy', 'false');

    const 안내 = document.getElementById('count');
    안내.textContent = posts.length === 1
      ? '첫 번째 이야기가 올라왔어요'
      : `지금까지 ${posts.length}개의 이야기가 모였어요`;
  }

  // ── 같은 사람이 다시 들어왔을 때는 지난번 목록을 먼저 그려 둡니다 ──
  //    구글 서버 응답이 오면 그 내용으로 곧바로 덮어씁니다.
  //    30분이 지난 기록은 쓰지 않습니다 — 내린 글이 잠깐이라도 다시 보이면 안 되니까요.
  const 저장칸 = 'grace_last_v1';
  const 유효시간 = 30 * 60 * 1000;

  function 지난목록() {
    try {
      const raw = localStorage.getItem(저장칸);
      if (!raw) return null;
      const d = JSON.parse(raw);
      if (!d || !d.t || Date.now() - d.t > 유효시간) return null;
      return d.posts;
    } catch (e) { return null; }
  }

  function 목록저장(posts) {
    try { localStorage.setItem(저장칸, JSON.stringify({ t: Date.now(), posts: posts })); }
    catch (e) { /* 저장 공간이 막혀 있어도 화면은 그대로 동작합니다 */ }
  }

  (function () {
  if (!API_URL) {
    list.innerHTML = '<div class="state">게시판을 준비하고 있어요. 곧 만나요 💧</div>';
    return;
  }

  const 미리 = 지난목록();
  if (미리) render(미리);
  const 지문 = JSON.stringify(미리 || null);

  fetch(API_URL)
    .then(r => r.json())
    .then(d => {
      if (!d.ok) throw new Error(d.error);
      // 내용이 지난번과 같으면 다시 그리지 않습니다 (펼쳐 둔 글이 도로 접히지 않게)
      if (JSON.stringify(d.posts) !== 지문) render(d.posts);
      목록저장(d.posts);
    })
    .catch(() => {
      if (미리) return;   // 지난 목록이라도 떠 있으면 그대로 둡니다
      list.innerHTML = '<div class="state">나눔을 불러오지 못했어요. 잠시 후 새로고침해 주세요.</div>';
    });
  })();
</script>
</body>
</html>
